<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenSearch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --border: #2a2a2a;
    --border-focus: #a3e635;
    --accent: #a3e635;
    --accent-dim: rgba(163, 230, 53, 0.08);
    --text: #e8e8e8;
    --muted: #555;
    --fdroid: #1976d2;
    --github: #e8e8e8;
    --font: 'JetBrains Mono', 'Courier New', monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 1.5rem;
  }

  .wordmark {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    user-select: none;
  }

  .search-wrap {
    width: 100%;
    max-width: 560px;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    pointer-events: none;
    color: var(--muted);
    transition: color 0.15s;
  }

  #query {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 0.85rem 1rem 0.85rem 2.75rem;
    font-family: var(--font);
    font-size: 1rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    caret-color: var(--accent);
  }

  #query::placeholder { color: var(--muted); }

  #query:focus {
    border-color: var(--border-focus);
    background: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(163, 230, 53, 0.06);
  }

  #query:focus + .search-icon,
  .search-wrap:focus-within .search-icon {
    color: var(--accent);
  }

  /* reorder icon so it layered correctly */
  .search-wrap .search-icon { z-index: 1; }

  .targets {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
    justify-content: center;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.1rem;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.1s;
    user-select: none;
  }

  .btn:hover, .btn:focus-visible {
    outline: none;
    transform: translateY(-1px);
  }

  .btn-fdroid:hover, .btn-fdroid:focus-visible {
    border-color: var(--fdroid);
    color: #64b5f6;
    background: rgba(25, 118, 210, 0.08);
  }

  .btn-github:hover, .btn-github:focus-visible {
    border-color: #666;
    color: #fff;
    background: rgba(255,255,255,0.06);
  }

  .btn-all {
    border-color: var(--border-focus);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .btn-all:hover, .btn-all:focus-visible {
    background: rgba(163, 230, 53, 0.14);
  }

  .divider {
    width: 1px;
    height: 1.2rem;
    background: var(--border);
    align-self: center;
  }

  .hint {
    margin-top: 2.5rem;
    font-size: 0.65rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
  }

  .hint kbd {
    display: inline-block;
    padding: 0.1em 0.35em;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: var(--font);
    font-size: 0.65rem;
    color: #777;
  }

  /* Results links */
  .results {
    display: none;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 1.2rem;
    width: 100%;
    max-width: 560px;
  }

  .results.visible { display: flex; }

  .result-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1.1rem;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    cursor: pointer;
  }

  .result-link:hover, .result-link:focus-visible {
    outline: none;
    transform: translateY(-1px);
  }

  .result-link.fdroid:hover, .result-link.fdroid:focus-visible {
    border-color: var(--fdroid);
    background: rgba(25, 118, 210, 0.08);
    color: #64b5f6;
  }

  .result-link.github:hover, .result-link.github:focus-visible {
    border-color: #666;
    background: rgba(255,255,255,0.06);
    color: #fff;
  }

  .result-link .arrow {
    margin-left: auto;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .result-query {
    color: var(--accent);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 160px;
  }

  /* SVG icons inline */
  svg.icon { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
</style>
</head>
<body>

<p class="wordmark">open search</p>

<div class="search-wrap">
  <input
    id="query"
    type="text"
    placeholder="buscar aplicaciones..."
    autocomplete="off"
    spellcheck="false"
    autofocus
  >
  <!-- search icon inside input -->
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="11" cy="11" r="8"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
</div>

<div class="targets">
  <button class="btn btn-all" onclick="search()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Buscar
  </button>
</div>

<div class="results" id="results">
  <a class="result-link fdroid" id="link-fdroid" href="#" target="_blank" rel="noopener">
    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#1976d2">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15H9V8h2v9zm4 0h-2V8h2v9z"/>
    </svg>
    F-Droid &nbsp;<span class="result-query" id="q-fdroid"></span>
    <span class="arrow">↗</span>
  </a>
  <a class="result-link github" id="link-github" href="#" target="_blank" rel="noopener">
    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </svg>
    GitHub &nbsp;<span class="result-query" id="q-github"></span>
    <span class="arrow">↗</span>
  </a>
</div>

<p class="hint"><kbd>Enter</kbd> para buscar</p>

<script>
  const input = document.getElementById('query');
  const results = document.getElementById('results');
  const linkFdroid = document.getElementById('link-fdroid');
  const linkGithub = document.getElementById('link-github');
  const qFdroid = document.getElementById('q-fdroid');
  const qGithub = document.getElementById('q-github');

  function search() {
    const q = input.value.trim();
    if (!q) { input.focus(); return; }
    const enc = encodeURIComponent(q);
    const label = q.length > 20 ? q.slice(0, 18) + '…' : q;

    linkFdroid.href = `https://search.f-droid.org/?q=${enc}`;
    linkGithub.href = `https://github.com/search?q=${enc}&type=repositories`;
    qFdroid.textContent = `"${label}"`;
    qGithub.textContent = `"${label}"`;

    results.classList.add('visible');
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });

  // hide results when user types again
  input.addEventListener('input', () => {
    results.classList.remove('visible');
  });
</script>

</body>
</html>
